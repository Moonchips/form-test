<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Submission</title>
  <!-- Load the Turnstile API Script -->
  <script src="https://cloudflare.com" async defer></script>
</head>
<body>

  <form action="/" method="POST">
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required>

    <!-- Embedded Turnstile Widget Container (Replace with your actual Site Key) -->
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAEEyBWf1DWeQKkRg" data-theme="light"></div>

    <button type="submit">Submit Form</button>
  </form>

</body>
</html>
